<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste notificações — Minha Escala</title><style>body{font:16px system-ui;background:#f7f8f9;color:#233;padding:24px;max-width:520px;margin:auto}button{background:#079b7b;color:white;border:0;border-radius:12px;padding:14px 18px;font:inherit}pre{white-space:pre-wrap;background:white;padding:16px;border-radius:12px}</style></head><body><h2>🐾 Minha Escala — diagnóstico</h2><p>Teste isolado. Não altera a escala nem a sessão.</p><button id="check">Verificar compatibilidade</button><pre id="result">À espera do teste.</pre><script>document.querySelector("#check").onclick=()=>{let info={seguro:window.isSecureContext,serviceWorker:"serviceWorker"in navigator,notifications:"Notification"in window,pushManager:"PushManager"in window,instalada:matchMedia("(display-mode: standalone)").matches,permissao:"Notification"in window?Notification.permission:"indisponível"};document.querySelector("#result").textContent=JSON.stringify(info,null,2)}</script></body></html>
