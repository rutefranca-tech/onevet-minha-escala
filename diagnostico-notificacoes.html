<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste notificações — Minha Escala</title><style>body{font:16px system-ui;background:#f7f8f9;color:#233;padding:24px;max-width:520px;margin:auto}button{background:#079b7b;color:white;border:0;border-radius:12px;padding:14px 18px;font:inherit}pre{white-space:pre-wrap;background:white;padding:16px;border-radius:12px}</style></head><body><h2>🐾 Minha Escala — diagnóstico</h2><p>Teste isolado. Não altera a escala nem a sessão.</p><button id="check">Verificar compatibilidade</button><p><button id="notify">🔔 Enviar notificação de teste</button></p><pre id="result">À espera do teste.</pre><script>document.querySelector("#check").onclick=()=>{let info={seguro:window.isSecureContext,serviceWorker:"serviceWorker"in navigator,notifications:"Notification"in window,pushManager:"PushManager"in window,instalada:matchMedia("(display-mode: standalone)").matches,permissao:"Notification"in window?Notification.permission:"indisponível"};document.querySelector("#result").textContent=JSON.stringify(info,null,2)}document.querySelector("#notify").onclick=async()=>{const el=document.querySelector("#result");try{if(Notification.permission!=="granted")throw Error("Notificações ainda não autorizadas");const reg=await navigator.serviceWorker.register("./teste-notificacoes-sw.js");await navigator.serviceWorker.ready;await reg.showNotification("🐾 Minha Escala",{body:"Teste de notificação no Mac concluído!",tag:"minha-escala-test"});el.textContent="Notificação enviada ao sistema. Verifica o Centro de Notificações do Mac."}catch(e){el.textContent="Erro: "+e.message}}</script></body></html>
